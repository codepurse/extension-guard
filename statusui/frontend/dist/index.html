<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Extension Guard</title>
<style>
  /* One screen, one question: is the lock holding? Everything here is arranged
     around answering that in the first second, and explaining it in the second. */
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --line: #242833;
    --text: #e8eaef;
    --muted: #9aa1b1;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --brand: #6ee7b7;
    --on-brand: #05261a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --line: #e4e7ec; --text: #131720;
      --muted: #5b6474; --on-brand: #04231a;
    }
  }
  * { box-sizing: border-box; }
  /* The backdrop sits behind everything and is never interactive. The content
     above it is raised rather than the canvas pushed back, so nothing in the
     page needs to know it is there. */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .titlebar, main { position: relative; z-index: 1; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* The title bar is the only draggable strip; everything else must stay
     clickable, so the drag region is declared here and nowhere else. */
  .titlebar {
    height: 40px; flex: none; display: flex; align-items: center;
    padding: 0 6px 0 16px; gap: 4px;
    border-bottom: 1px solid transparent;
    --wails-draggable: drag;
    user-select: none;
  }
  .titlebar .name { font-size: 12px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  .titlebar .grow { flex: 1; }
  .winbtn {
    --wails-draggable: no-drag;
    width: 42px; height: 30px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--muted); font-size: 15px; line-height: 1;
    display: grid; place-items: center;
  }
  .winbtn:hover { background: var(--line); color: var(--text); }
  .winbtn.close:hover { background: #e11d48; color: #fff; }

  /* The window is a fixed size, so the page itself never scrolls - a scrollbar
     down the side of a screen this small is most of a column of chrome for
     nothing. The one list that can outgrow its space scrolls inside itself
     instead; see #ext-card. */
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 4px 22px 30px; }

  /* ---- the orb ----
     The canvas draws the sphere; everything here is the frame around it. The
     glyph in the middle is the state said in a shape as well as a colour, which
     is what keeps the dial readable for anyone who does not separate green from
     amber from red. */
  .dial { display: grid; place-items: center; padding: 6px 0 0; }
  .ring { position: relative; width: 216px; height: 216px; }
  .ring canvas { width: 100%; height: 100%; display: block; }
  .ring .mark {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 34px; line-height: 1; font-weight: 300;
    color: var(--ok); text-shadow: 0 0 18px currentColor;
    transition: color .3s ease;
    pointer-events: none;
  }
  .ring[data-state="warn"] .mark { color: var(--warn); }
  .ring[data-state="bad"]  .mark { color: var(--bad); }
  .verdict { text-align: center; margin: 2px 0 2px; font-size: 20px; font-weight: 600; }
  .why {
    text-align: center; color: var(--muted); margin: 0 auto 12px; max-width: 34ch;
    min-height: 38px;
  }

  /* ---- cards ---- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 4px 16px; margin-bottom: 12px;
    flex: none;
  }
  /* The extensions are the only part whose length is not known in advance. Two
     is the usual number and fits; a machine locking six should scroll this list
     rather than push the settings off the bottom of a window that cannot be
     resized. */
  #ext-card { overflow-y: auto; max-height: 140px; }
  #ext-card::-webkit-scrollbar { width: 8px; }
  #ext-card::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .body { flex: 1; min-width: 0; }
  .row .lbl { font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row .sub.warn { color: var(--warn); }

  /* ---- toggle ---- */
  .toggle {
    --wails-draggable: no-drag;
    flex: none; width: 46px; height: 27px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--line); position: relative; cursor: pointer; padding: 0;
    transition: background .18s ease;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px;
    border-radius: 50%; background: var(--muted); transition: transform .18s ease, background .18s ease;
  }
  .toggle[aria-checked="true"] { background: var(--brand); border-color: transparent; }
  .toggle[aria-checked="true"]::after { transform: translateX(19px); background: var(--on-brand); }
  .toggle:disabled { opacity: .45; cursor: default; }

  .ext { display: flex; align-items: center; gap: 10px; padding: 11px 0; }
  .ext + .ext { border-top: 1px solid var(--line); }
  .ext .name { flex: 1; font-weight: 600; }
  .ext .count { color: var(--muted); font-size: 12.5px; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 99px;
    background: var(--line); color: var(--muted);
  }
  .pill.on { background: rgba(74,222,128,.14); color: var(--ok); }
  .pill.off { background: rgba(248,113,113,.14); color: var(--bad); }

  .foot {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; padding: 2px 2px 0;
  }
  .foot .grow { flex: 1; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .link:hover { color: var(--text); }

  .msg { min-height: 18px; text-align: center; font-size: 13px; margin: 0 0 8px; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  /* ---- password prompt ---- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; place-items: center; padding: 24px; z-index: 20;
  }
  .backdrop.show { display: grid; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; width: 100%; max-width: 340px;
  }
  .modal h2 { margin: 0 0 6px; font-size: 16px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .modal input {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .btn {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font: inherit;
  }
  .btn.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); font-weight: 600; }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="titlebar">
  <span class="name">Extension Guard</span>
  <span class="grow"></span>
  <button class="winbtn" id="min" title="Minimise">&#8211;</button>
  <button class="winbtn close" id="close" title="Close">&times;</button>
</div>

<main>
  <div class="dial">
    <div class="ring" id="ring" data-state="bad">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="mark" id="mark">&#10005;</div>
    </div>
  </div>
  <div class="verdict" id="verdict">Checking…</div>
  <div class="why" id="why"></div>
  <div class="msg" id="msg"></div>

  <div class="card" id="ext-card"></div>

  <div class="card">
    <div class="row">
      <div class="body">
        <div class="lbl">Block browsers we cannot reach</div>
        <div class="sub" id="unmanaged-sub"></div>
      </div>
      <button class="toggle" id="tg-browsers" role="switch" aria-checked="false"></button>
    </div>
    <div class="row">
      <div class="body">
        <div class="lbl">Turn off private windows</div>
        <div class="sub" id="private-sub">A locked extension does not run in one.</div>
      </div>
      <button class="toggle" id="tg-private" role="switch" aria-checked="false"></button>
    </div>
  </div>

  <div class="foot">
    <span id="version"></span>
    <span class="grow"></span>
    <button class="link" id="check-update">Check for updates</button>
  </div>
</main>

<div class="backdrop" id="pw-back">
  <div class="modal">
    <h2 id="pw-title">Password needed</h2>
    <p id="pw-why"></p>
    <input type="password" id="pw-input" autocomplete="off" placeholder="Uninstall password" />
    <div class="acts">
      <button class="btn" id="pw-cancel">Cancel</button>
      <button class="btn primary" id="pw-ok">Continue</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const $ = function (id) { return document.getElementById(id); };
  let current = {};

  function bound() { return window.go && window.go.main && window.go.main.App; }

  function setMsg(text, kind) {
    const n = $('msg');
    n.textContent = text || '';
    n.className = 'msg' + (kind ? ' ' + kind : '');
  }

  // askPassword resolves to the typed password, or null if cancelled. Only the
  // changes that weaken protection reach it - see NeedsPassword, which the guard
  // answers rather than this page deciding twice.
  function askPassword(title, why) {
    return new Promise(function (resolve) {
      const back = $('pw-back'), input = $('pw-input');
      $('pw-title').textContent = title;
      $('pw-why').textContent = why;
      input.value = '';
      back.classList.add('show');
      setTimeout(function () { input.focus(); }, 0);

      function done(v) {
        back.classList.remove('show');
        $('pw-ok').removeEventListener('click', ok);
        $('pw-cancel').removeEventListener('click', cancel);
        input.removeEventListener('keydown', key);
        resolve(v);
      }
      function ok() { done(input.value); }
      function cancel() { done(null); }
      function key(e) {
        if (e.key === 'Enter') { ok(); }
        if (e.key === 'Escape') { cancel(); }
      }
      $('pw-ok').addEventListener('click', ok);
      $('pw-cancel').addEventListener('click', cancel);
      input.addEventListener('keydown', key);
    });
  }

  // ---- the orb ----------------------------------------------------------
  //
  // A shell of particles on a slowly turning sphere, drawn with additive
  // blending so overlapping points bloom into each other. It is canvas rather
  // than three.js or pixi for one reason: this window ships its assets inside
  // the binary and has no network, so a library would have to be vendored - and
  // 600KB of WebGL engine to draw one decorative circle is a poor trade against
  // 150 lines that do the same thing.
  //
  // The colour carries the state, but the colour is not the only thing that
  // does: the glyph in the middle says the same in a shape, for anyone who does
  // not separate green from amber from red.

  const ORB = (function () {
    const canvas = document.getElementById('orb');
    const ctx = canvas.getContext('2d');

    // Points are laid out on a Fibonacci sphere, which spaces them evenly
    // without the crowding at the poles that a naive lat/long grid gives.
    const COUNT = 620;
    const pts = [];
    (function build() {
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < COUNT; i++) {
        const y = 1 - (i / (COUNT - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const th = golden * i;
        pts.push({
          x: Math.cos(th) * r, y: y, z: Math.sin(th) * r,
          // A per-point phase so the shimmer is not one synchronised pulse.
          ph: Math.random() * Math.PI * 2,
          sp: 0.6 + Math.random() * 0.9
        });
      }
    })();

    const PALETTE = {
      ok:   { core: [110, 231, 183], halo: [ 16, 185, 129] },
      warn: { core: [251, 191,  36], halo: [217, 119,   6] },
      bad:  { core: [248, 113, 113], halo: [220,  38,  38] }
    };

    let state = 'bad';
    let spin = 0;
    let raf = 0;
    let size = 0;

    // The backdrop: a few motes drifting up through the window, far too faint to
    // look at directly. It shares this module's animation loop rather than
    // starting a second one - two rAF loops in a window this small is two wake-
    // ups a frame for one idea.
    const bg = document.getElementById('bg');
    const bgx = bg.getContext('2d');
    const MOTES = 34;
    const motes = [];
    let bw = 0, bh = 0;
    function seedMotes() {
      motes.length = 0;
      for (let i = 0; i < MOTES; i++) {
        motes.push({
          x: Math.random(), y: Math.random(),
          r: 0.6 + Math.random() * 1.5,
          // Slow, and each at its own pace: a field that drifts in lockstep
          // reads as a texture sliding rather than as dust in the air.
          v: 0.006 + Math.random() * 0.014,
          sway: Math.random() * Math.PI * 2,
          a: 0.05 + Math.random() * 0.13
        });
      }
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const css = canvas.clientWidth || 216;
      size = css;
      canvas.width = Math.round(css * dpr);
      canvas.height = Math.round(css * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      bw = bg.clientWidth || window.innerWidth;
      bh = bg.clientHeight || window.innerHeight;
      bg.width = Math.round(bw * dpr);
      bg.height = Math.round(bh * dpr);
      bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawBackdrop(t, p) {
      bgx.clearRect(0, 0, bw, bh);

      // A wash under the dial, echoing whatever the orb is currently saying.
      // It is what stops the top of the window reading as a flat panel with a
      // glowing object stuck on it.
      const wash = bgx.createRadialGradient(bw / 2, bh * 0.16, 0, bw / 2, bh * 0.16, bw * 0.85);
      wash.addColorStop(0, rgba(p.halo, 0.10));
      wash.addColorStop(0.5, rgba(p.halo, 0.03));
      wash.addColorStop(1, rgba(p.halo, 0));
      bgx.fillStyle = wash;
      bgx.fillRect(0, 0, bw, bh);

      bgx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MOTES; i++) {
        const m = motes[i];
        m.y -= m.v / 60;
        if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
        const x = (m.x + Math.sin(t * 0.0002 + m.sway) * 0.012) * bw;
        bgx.fillStyle = rgba(p.core, m.a);
        bgx.beginPath();
        bgx.arc(x, m.y * bh, m.r, 0, Math.PI * 2);
        bgx.fill();
      }
      bgx.globalCompositeOperation = 'source-over';
    }

    function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

    function frame(t) {
      const p = PALETTE[state] || PALETTE.bad;
      drawBackdrop(t, p);

      const mid = size / 2;
      const radius = size * 0.27;

      ctx.clearRect(0, 0, size, size);

      // Its own night sky, and not decoration. The particles are drawn with
      // additive blending, which brightens what is underneath - and nothing is
      // brighter than white, so on a light background the whole effect
      // disappears. A soft dark well, fading out well before the canvas edge so
      // there is no disc to see, gives the light something to be light against
      // in either theme.
      const ground = ctx.createRadialGradient(mid, mid, 0, mid, mid, radius * 1.62);
      ground.addColorStop(0, 'rgba(6,10,20,0.95)');
      ground.addColorStop(0.5, 'rgba(6,10,20,0.86)');
      ground.addColorStop(0.76, 'rgba(6,10,20,0.42)');
      ground.addColorStop(0.9, 'rgba(6,10,20,0.12)');
      ground.addColorStop(1, 'rgba(6,10,20,0)');
      ctx.fillStyle = ground;
      ctx.fillRect(0, 0, size, size);

      // The outer bloom: two soft radial washes, the wider one very faint. This
      // is what reads as light spilling off the shell rather than a drawn edge.
      const glow = ctx.createRadialGradient(mid, mid, radius * 0.6, mid, mid, radius * 1.85);
      glow.addColorStop(0, rgba(p.halo, 0.34));
      glow.addColorStop(0.35, rgba(p.halo, 0.16));
      glow.addColorStop(1, rgba(p.halo, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, size, size);

      // The rim: brightest exactly at the silhouette, because that is where the
      // shell is edge-on and the most particles line up behind each other.
      const rim = ctx.createRadialGradient(mid, mid, radius * 0.7, mid, mid, radius * 1.12);
      rim.addColorStop(0, rgba(p.core, 0));
      rim.addColorStop(0.62, rgba(p.core, 0.14));
      rim.addColorStop(0.84, rgba(p.core, 0.38));
      rim.addColorStop(1, rgba(p.core, 0));
      ctx.fillStyle = rim;
      ctx.fillRect(0, 0, size, size);

      spin += 0.0016;
      const cos = Math.cos(spin), sin = Math.sin(spin);
      // Tipped slightly towards the viewer, so the sphere reads as a globe
      // rather than a flat disc of dots.
      const tilt = -0.32, ct = Math.cos(tilt), st = Math.sin(tilt);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < COUNT; i++) {
        const q = pts[i];
        // Spin about Y, then tip about X.
        const x1 = q.x * cos + q.z * sin;
        const z1 = q.z * cos - q.x * sin;
        const y2 = q.y * ct - z1 * st;
        const z2 = z1 * ct + q.y * st;

        // Depth: 0 at the back, 1 at the front.
        const d = (z2 + 1) / 2;
        // How close this point sits to the silhouette, 0 at the middle of the
        // disc and 1 at the edge. This is what carries the look: a shell is
        // edge-on at its limb, so that is where the most particles stack up
        // behind each other and where a real one is brightest. Weighting by
        // depth alone lights the middle instead, which reads as a ball of dots
        // rather than a hollow sphere.
        const limb = Math.sqrt(x1 * x1 + y2 * y2);
        const edge = limb * limb * limb;

        const shimmer = 0.62 + 0.38 * Math.sin(t * 0.0012 * q.sp + q.ph);
        // The far half stays faintly visible, which is what makes it something
        // you see through rather than a disc.
        const face = 0.28 + d * 0.72;
        const alpha = (0.05 + edge * 0.95) * face * shimmer;
        const dot = (0.5 + d * 0.9 + edge * 0.6) * (size / 216);

        ctx.fillStyle = rgba(p.core, alpha);
        ctx.beginPath();
        ctx.arc(mid + x1 * radius, mid + y2 * radius, dot, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (raf) { return; }
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!raf) { return; }
      cancelAnimationFrame(raf);
      raf = 0;
    }

    // A desktop window spends its life in the background. An animation running
    // there is battery somebody else is paying for, so it stops when the window
    // is not on screen and picks up where it left off.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stop(); } else { start(); }
    });
    window.addEventListener('resize', resize);

    seedMotes();
    resize();
    start();
    return { set: function (s) { state = s; } };
  })();

  function render(s) {
    current = s || {};

    const ring = $('ring'), mark = $('mark');
    let state = 'bad', glyph = '✕';
    if (s.protected) {
      state = 'ok'; glyph = '✓';
    } else if (s.serviceRunning && !s.disabled) {
      // Running and holding something, but with a way round it.
      state = 'warn'; glyph = '!';
    }
    ring.dataset.state = state;
    mark.textContent = glyph;
    ORB.set(state);

    $('verdict').textContent = s.summary || '';
    $('why').textContent = s.detail || '';
    $('version').textContent = s.version ? 'Version ' + s.version : '';

    // Extensions.
    const card = $('ext-card');
    card.innerHTML = '';
    const exts = s.extensions || [];
    if (!exts.length) {
      const row = document.createElement('div');
      row.className = 'ext';
      row.innerHTML = '<div class="name">No extension configured</div>';
      card.appendChild(row);
    }
    exts.forEach(function (e) {
      const row = document.createElement('div');
      row.className = 'ext';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = e.label || e.name;
      row.appendChild(name);

      const count = document.createElement('div');
      count.className = 'count';
      // "2 of 3" says more than "partly": the reader can tell whether the gap is
      // one browser or most of them.
      count.textContent = e.total ? e.locked + ' of ' + e.total : 'no browser here';
      row.appendChild(count);

      const pill = document.createElement('span');
      const on = !!e.enabled;
      pill.className = 'pill ' + (on ? 'on' : 'off');
      pill.textContent = on ? 'Locked' : 'Off';
      row.appendChild(pill);

      const tg = document.createElement('button');
      tg.className = 'toggle';
      tg.setAttribute('role', 'switch');
      tg.setAttribute('aria-checked', on ? 'true' : 'false');
      tg.addEventListener('click', function () { toggleExtension(e, !on); });
      row.appendChild(tg);

      card.appendChild(row);
    });

    // The two settings.
    const loose = (s.unmanaged || []).filter(function (u) { return !u.blocked; });
    const sub = $('unmanaged-sub');
    if (!s.unmanagedScanned) {
      sub.textContent = 'This machine could not be scanned for other browsers.';
      sub.className = 'sub';
    } else if (!(s.unmanaged || []).length) {
      sub.textContent = 'None are installed here right now.';
      sub.className = 'sub';
    } else if (loose.length) {
      sub.textContent = loose.map(function (u) { return u.label; }).join(', ')
        + ' carries none of the locked extensions.';
      sub.className = 'sub warn';
    } else {
      sub.textContent = (s.unmanaged || []).map(function (u) { return u.label; }).join(', ') + ' blocked.';
      sub.className = 'sub';
    }
    setToggle($('tg-browsers'), !!s.blockUnsupported);

    const psub = $('private-sub');
    if (s.privateBrowsingOpen) {
      psub.textContent = 'Private windows are open, and a locked extension does not run in one.';
      psub.className = 'sub warn';
    } else {
      psub.textContent = 'A locked extension does not run in one.';
      psub.className = 'sub';
    }
    setToggle($('tg-private'), !!s.privateBrowsing);
  }

  function setToggle(el, on) { el.setAttribute('aria-checked', on ? 'true' : 'false'); }

  async function refresh() {
    if (!bound()) { return; }
    try { render(await window.go.main.App.GetStatus()); }
    catch (e) { setMsg('Could not read the status: ' + e, 'bad'); }
  }

  function report(res) {
    if (!res) { return; }
    setMsg(res.message || '', res.ok ? 'ok' : 'bad');
  }

  // needsPassword is asked of the guard rather than decided here, so the rule
  // lives in one place and this page cannot drift from it.
  async function needsPassword(turningOn) {
    try { return await window.go.main.App.NeedsPassword(turningOn); }
    catch (e) { return false; }
  }

  async function guarded(turningOn, title, why, run) {
    let pw = '';
    if (await needsPassword(turningOn)) {
      pw = await askPassword(title, why);
      if (pw === null) { return; }
    }
    setMsg('Approve the Windows permission prompt…');
    try { report(await run(pw)); }
    catch (e) { setMsg(String(e), 'bad'); }
    await refresh();
  }

  async function toggleExtension(e, on) {
    if (!bound()) { return; }
    const label = e.label || e.name;
    if (on) {
      setMsg('Approve the Windows permission prompt…');
      try { report(await window.go.main.App.EnableExtension(e.name)); }
      catch (err) { setMsg(String(err), 'bad'); }
      await refresh();
      return;
    }
    await guarded(false,
      'Turn off ' + label + '?',
      'It stops being force-installed, and can then be removed from the browser.',
      function (pw) { return window.go.main.App.DisableExtension(e.name, pw); });
  }

  $('tg-browsers').addEventListener('click', function () {
    const on = !current.blockUnsupported;
    guarded(on,
      'Let other browsers run?',
      'A browser the guard cannot reach carries none of the locked extensions.',
      function (pw) { return window.go.main.App.SetBlockUnsupported(on, pw); });
  });

  $('tg-private').addEventListener('click', function () {
    const on = !current.privateBrowsing;
    guarded(on,
      'Allow private windows?',
      'A locked extension does not run in one, so everything it filters is reachable there.',
      function (pw) { return window.go.main.App.SetPrivateBrowsing(on, pw); });
  });

  $('check-update').addEventListener('click', async function () {
    if (!bound()) { return; }
    setMsg('Checking…');
    try {
      const u = await window.go.main.App.CheckForUpdate();
      if (u.error) { setMsg(u.error, 'bad'); return; }
      setMsg(u.available ? 'Version ' + u.latest + ' is available.' : 'This is the newest version.',
             u.available ? '' : 'ok');
    } catch (e) { setMsg(String(e), 'bad'); }
  });

  $('min').addEventListener('click', function () {
    if (window.runtime) { window.runtime.WindowMinimise(); }
  });
  $('close').addEventListener('click', function () {
    if (window.runtime) { window.runtime.Quit(); }
  });

  refresh();
  // The service changes things on its own - a pause running out, a browser
  // installed - so the window follows rather than showing whatever was true when
  // it opened.
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
